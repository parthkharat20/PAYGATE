<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Title -->
  <text x="120" y="32" font-size="18" font-weight="700" fill="#0f172a">Attack Success Rate (ASR) Across Defense Configurations</text>
  <text x="120" y="50" font-size="12" fill="#64748b">Evaluated on N=190 attack cases (10 in-policy adaptive + 180 synthetic) with Wilson 95% Confidence Intervals</text>
  <!-- Grid Lines -->
  <line x1="120" y1="340.0" x2="680" y2="340.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="108" y="344.0" font-size="11" fill="#64748b" text-anchor="end">0%</text>
  <line x1="120" y1="270.0" x2="680" y2="270.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="108" y="274.0" font-size="11" fill="#64748b" text-anchor="end">20%</text>
  <line x1="120" y1="200.0" x2="680" y2="200.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="108" y="204.0" font-size="11" fill="#64748b" text-anchor="end">40%</text>
  <line x1="120" y1="130.0" x2="680" y2="130.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="108" y="134.0" font-size="11" fill="#64748b" text-anchor="end">60%</text>
  <line x1="120" y1="60.0" x2="680" y2="60.0" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="108" y="64.0" font-size="11" fill="#64748b" text-anchor="end">80%</text>
  <line x1="120" y1="60" x2="120" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="120" y1="340" x2="680" y2="340" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Bar C0a: Permissive -->
  <rect x="155.0" y="130.0" width="70" height="210.0" fill="#e11d48" rx="4" opacity="0.9"/>
  <line x1="190.0" y1="154.85" x2="190.0" y2="106.55000000000001" stroke="#0f172a" stroke-width="2"/>
  <line x1="182.0" y1="154.85" x2="198.0" y2="154.85" stroke="#0f172a" stroke-width="2"/>
  <line x1="182.0" y1="106.55000000000001" x2="198.0" y2="106.55000000000001" stroke="#0f172a" stroke-width="2"/>
  <text x="190.0" y="96.55000000000001" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">60.0%</text>
  <text x="190.0" y="82.55000000000001" font-size="10" fill="#475569" text-anchor="middle">[52.9%, 66.7%]</text>
  <text x="190.0" y="364" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">C0a: Permissive</text>
  <text x="190.0" y="380" font-size="10" fill="#64748b" text-anchor="middle">Unconstrained Tools</text>
  <!-- Bar C0b: Processor -->
  <rect x="295.0" y="284.7" width="70" height="55.300000000000004" fill="#ea580c" rx="4" opacity="0.9"/>
  <line x1="330.0" y1="300.8" x2="330.0" y2="263.7" stroke="#0f172a" stroke-width="2"/>
  <line x1="322.0" y1="300.8" x2="338.0" y2="300.8" stroke="#0f172a" stroke-width="2"/>
  <line x1="322.0" y1="263.7" x2="338.0" y2="263.7" stroke="#0f172a" stroke-width="2"/>
  <text x="330.0" y="253.7" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">15.8%</text>
  <text x="330.0" y="239.7" font-size="10" fill="#475569" text-anchor="middle">[11.2%, 21.8%]</text>
  <text x="330.0" y="364" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">C0b: Processor</text>
  <text x="330.0" y="380" font-size="10" fill="#64748b" text-anchor="middle">Standard Rail Invariants</text>
  <!-- Bar C1: Prompt Guard -->
  <rect x="435.0" y="303.25" width="70" height="36.75" fill="#d97706" rx="4" opacity="0.9"/>
  <line x1="470.0" y1="316.2" x2="470.0" y2="284.7" stroke="#0f172a" stroke-width="2"/>
  <line x1="462.0" y1="316.2" x2="478.0" y2="316.2" stroke="#0f172a" stroke-width="2"/>
  <line x1="462.0" y1="284.7" x2="478.0" y2="284.7" stroke="#0f172a" stroke-width="2"/>
  <text x="470.0" y="274.7" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">10.5%</text>
  <text x="470.0" y="260.7" font-size="10" fill="#475569" text-anchor="middle">[6.8%, 15.8%]</text>
  <text x="470.0" y="364" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">C1: Prompt Guard</text>
  <text x="470.0" y="380" font-size="10" fill="#64748b" text-anchor="middle">Defensive System Prompt</text>
  <!-- Bar C2: PayGate -->
  <rect x="575.0" y="340.0" width="70" height="2" fill="#059669" rx="4" opacity="0.9"/>
  <line x1="610.0" y1="340.0" x2="610.0" y2="333.0" stroke="#0f172a" stroke-width="2"/>
  <line x1="602.0" y1="340.0" x2="618.0" y2="340.0" stroke="#0f172a" stroke-width="2"/>
  <line x1="602.0" y1="333.0" x2="618.0" y2="333.0" stroke="#0f172a" stroke-width="2"/>
  <text x="610.0" y="323.0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">0.0%</text>
  <text x="610.0" y="309.0" font-size="10" fill="#475569" text-anchor="middle">[0.0%, 2.0%]</text>
  <text x="610.0" y="364" font-size="12" font-weight="600" fill="#1e293b" text-anchor="middle">C2: PayGate</text>
  <text x="610.0" y="380" font-size="10" fill="#64748b" text-anchor="middle">Deterministic Policy Gate</text>
</svg>